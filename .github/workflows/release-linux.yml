name: Release – Linux

on:
  push:
    tags:
      - 'v*.*.*'
      # Pre-release tags (v0.2.1-beta.1) belong to pre-release.yml: they are
      # published as GitHub prereleases, never through the stable path.
      - '!v*-*'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: "Version to bake into the package names (empty = derive it from the ref)"
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build-linux.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}-${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: "3.2.14"

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    outputs:
      artifact-name: cdin-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cdin-x is where the mandatory set lives: the vim plugin, the default
      # theme and the fonts. A cdin build bundles it into build/…/data via
      # scripts/assemble_data.py -> scripts/bundle.py. actions/checkout refuses
      # any `path` outside GITHUB_WORKSPACE, so it cannot be checked out as a
      # sibling (`../cdin-x`); it goes inside the workspace and CDINX_DIR points
      # the build at it. The build itself never fetches anything.
      - name: Checkout cdin-x (mandatory bundle source)
        uses: actions/checkout@v4
        with:
          repository: m-mdy-m/cdin-x
          path: cdin-x

      # mk/bundle.mk uses `CDINX_DIR ?=`, so the environment value is picked up
      # by every later `make` step without changing the make command lines.
      - name: Point the build at cdin-x
        run: echo "CDINX_DIR=${GITHUB_WORKSPACE//\\//}/cdin-x" >> "$GITHUB_ENV"

      - name: Cache apt packages
        uses: actions/cache@v4
        id: cache-apt
        with:
          path: /var/cache/apt/archives
          key: apt-ubuntu-22.04-cdin-v1
          restore-keys: apt-ubuntu-22.04-cdin-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc make pkg-config python3 python3-pip \
            librsvg2-bin \
            liblua5.4-dev \
            libuv1-dev \
            cmake ninja-build \
            libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            wget ca-certificates

      # ── Cache: SDL3 built from source ────────────────────────────────────
      - name: Cache SDL3
        uses: actions/cache@v4
        id: cache-sdl3
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-ubuntu-22.04

      - name: Build & install SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xf "SDL3-${SDL_VERSION}.tar.gz"
          cmake -S "SDL3-${SDL_VERSION}" -B /tmp/sdl3-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3 \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3-build --parallel $(nproc)
          sudo cmake --install /tmp/sdl3-build

      - name: Register SDL3 (ldconfig)
        run: |
          echo "/opt/sdl3/lib" | sudo tee /etc/ld.so.conf.d/sdl3.conf
          sudo ldconfig
          PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig pkg-config --modversion sdl3

      # ── Cache: pip (Pillow) ──────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-pillow-${{ runner.os }}

      - name: Generate icon assets
        run: |
          pip install --quiet Pillow
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg \
              -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
                        scripts/icon.svg \
            --out-inl        src/icon.inl \
            --out-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons:"
          ls -lh scripts/icons/

      - name: Build release binary
        env:
          PKG_CONFIG_PATH: /opt/sdl3/lib/pkgconfig
        run: make -j$(nproc) BUILD=release PLATFORM=linux SDL_VERSION=3

      - name: Verify binary
        run: |
          BIN="$(find build/linux-release -maxdepth 1 -name 'cdin' | head -1)"
          if [[ -z "$BIN" ]]; then
            echo "::error::Binary not found under build/linux-release/"
            find build/ -type f 2>/dev/null || echo "(build/ empty)"
            exit 1
          fi
          file "$BIN"
          echo "Binary: $BIN  ($(du -sh "$BIN" | cut -f1))"
          echo "BIN_PATH=$BIN" >> "$GITHUB_ENV"

      # ── Version for the package names ────────────────────────────────────
      # pre-release.yml passes the version it computed for this commit; a tag
      # push takes it from the tag; anything else is a local dev build.
      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            VER="${REQUESTED_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi

          # Debian reads the last hyphen as the boundary between the upstream
          # version and the Debian revision, so `0.2.1-beta.1` would be read as
          # upstream 0.2.1 + revision beta.1. `~` is valid there and sorts
          # *before* the plain release — the right way round for a
          # pre-release. A stable version carries no hyphen and is untouched.
          #
          # sed, not ${VER//-/~}: bash expands a `~` that appears in a
          # parameter substitution, which would quietly turn `~beta` into
          # `~<username>` — and fpm would then be handed a home directory.
          DEB_VER="$(printf '%s' "${VER#v}" | sed 's/-/~/')"

          {
            echo "version=${VER}"
            echo "deb-version=${DEB_VER}"
          } >> "$GITHUB_OUTPUT"

          echo "version=${VER}  (deb ${DEB_VER})"

      - name: Package tarball
        run: |
          VER="${{ steps.version.outputs.version }}"
          PKG_NAME="cdin-${VER}-linux-x86_64"
          PKG_DIR="dist/${PKG_NAME}"

          mkdir -p "${PKG_DIR}/bin"
          cp "${BIN_PATH}" "${PKG_DIR}/bin/cdin"
          chmod 755 "${PKG_DIR}/bin/cdin"

          # The ASSEMBLED data/, next to the binary that was just built —
          # not the source data/. The source holds only the runtime core; the
          # mandatory set (vim plugin, default theme, fonts) is bundled from
          # cdin-x into the build output at build time, and that is what a
          # release has to ship.
          BUILD_DIR="$(dirname "${BIN_PATH}")"
          [[ -d "${BUILD_DIR}/data" ]] && cp -a "${BUILD_DIR}/data/." "${PKG_DIR}/bin/data/"

          mkdir -p "${PKG_DIR}/scripts"
          cp -r scripts/icons "${PKG_DIR}/scripts/"
          [[ -f scripts/icon.svg ]] && cp scripts/icon.svg "${PKG_DIR}/scripts/"

          cp scripts/cdin.py "${PKG_DIR}/"
          cp -r scripts/_cdin "${PKG_DIR}/"

          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${PKG_DIR}/"
          done

          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"
          echo "Tarball: $(du -sh dist/${PKG_NAME}.tar.gz | cut -f1)"

      # ── Native package: .deb ─────────────────────────────────────────────
      - name: Install fpm & patchelf
        run: |
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential patchelf
          sudo gem install --no-document fpm

      - name: Stage install root (DESTDIR)
        env:
          PKG_CONFIG_PATH: /opt/sdl3/lib/pkgconfig
        run: |
          make install BUILD=release PLATFORM=linux SDL_VERSION=3 \
            PREFIX=/usr DESTDIR="${PWD}/dist/deb-root"

          # Bundle the SDL3 shared lib we built, point the binary at it via
          # RPATH ($ORIGIN — same directory, per `make install`'s layout:
          # the real binary lives at PREFIX/lib/cdin/cdin), so no system
          # libsdl3 is required.
          cp -a /opt/sdl3/lib/libSDL3.so* "dist/deb-root/usr/lib/cdin/"
          patchelf --set-rpath '$ORIGIN' "dist/deb-root/usr/lib/cdin/cdin"
          echo "RPATH set:"
          patchelf --print-rpath "dist/deb-root/usr/lib/cdin/cdin"

          install -Dm644 scripts/icons/cdin-256.png \
            "dist/deb-root/usr/share/icons/hicolor/256x256/apps/cdin.png"
          install -Dm644 scripts/icons/cdin-128.png \
            "dist/deb-root/usr/share/icons/hicolor/128x128/apps/cdin.png"
          install -Dm644 scripts/icons/cdin-48.png \
            "dist/deb-root/usr/share/icons/hicolor/48x48/apps/cdin.png"

          mkdir -p "dist/deb-root/usr/share/applications"
          # Written via printf (not a heredoc) so the file has no leading
          # whitespace, which the freedesktop .desktop spec requires.
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=cdin' \
            'Comment=A small, fast, keyboard-driven text editor' \
            'Exec=cdin %F' \
            'Icon=cdin' \
            'Terminal=false' \
            'Categories=Development;TextEditor;Utility;' \
            'MimeType=text/plain;' \
            > "dist/deb-root/usr/share/applications/cdin.desktop"

      - name: Build .deb package
        run: |
          DEB_VER="${{ steps.version.outputs.deb-version }}"

          fpm -s dir -t deb \
            -C "dist/deb-root" \
            -n cdin \
            -v "${DEB_VER}" \
            --architecture amd64 \
            --license MIT \
            --category editors \
            --maintainer "m-mdy-m" \
            --url "https://github.com/m-mdy-m/cdin" \
            --description "A small, fast, keyboard-driven text editor. Vim-style modal editing is on by default. The core is C; everything else is Lua you can read and change." \
            --depends "liblua5.4-0 | liblua5.3-0" \
            --depends "libwayland-client0 | libx11-6" \
            --deb-no-default-config-files \
            --package "dist/cdin_${DEB_VER}_amd64.deb"

          echo "Package: $(du -sh dist/cdin_${DEB_VER}_amd64.deb | cut -f1)"
          dpkg-deb --info "dist/cdin_${DEB_VER}_amd64.deb"

      - name: Verify .deb installs cleanly
        run: |
          DEB_VER="${{ steps.version.outputs.deb-version }}"
          sudo apt-get install -y "./dist/cdin_${DEB_VER}_amd64.deb"
          command -v cdin
          dpkg -L cdin | head -20
          sudo apt-get remove -y cdin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdin-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
          retention-days: 14