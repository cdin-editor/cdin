name: Development and rolling product release channels

on:
  workflow_run:
    workflows: ["CI", "Product Acceptance"]
    types: [completed]

permissions:
  contents: read

jobs:
  create-development-tag:
    name: Create a unique development tag for the verified commit
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_ref: ${{ steps.tag.outputs.source_ref }}
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create or verify the unique development tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag="v0.0.0-dev.$SOURCE_RUN_NUMBER"
          api_url="https://api.github.com/repos/$REPOSITORY/git/ref/tags/$tag"
          tag_ref_json="$RUNNER_TEMP/tag-ref.json"

          status="$(curl --silent --show-error --output "$tag_ref_json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_url")"
          case "$status" in
            200)
              echo "Development tag $tag already exists; verifying its immutable target."
              ;;
            404)
              gh api --method POST "repos/$REPOSITORY/git/refs" \
                -f "ref=refs/tags/$tag" \
                -f "sha=$SOURCE_SHA" >/dev/null
              gh api "repos/$REPOSITORY/git/ref/tags/$tag" > "$tag_ref_json"
              echo "Created development tag $tag."
              ;;
            *)
              echo "Could not inspect development tag $tag (HTTP $status)." >&2
              cat "$tag_ref_json" >&2
              exit 1
              ;;
          esac

          resolve_tag_commit() {
            local object_type object_sha tag_json depth=0
            object_type="$(jq -r '.object.type' "$tag_ref_json")"
            object_sha="$(jq -r '.object.sha' "$tag_ref_json")"
            while [[ "$object_type" == "tag" ]]; do
              (( depth += 1 ))
              if (( depth > 8 )); then
                echo "Development tag $tag has excessive annotated-tag nesting." >&2
                return 1
              fi
              tag_json="$(gh api "repos/$REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r '.object.type' <<< "$tag_json")"
              object_sha="$(jq -r '.object.sha' <<< "$tag_json")"
            done
            if [[ "$object_type" != "commit" || ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Development tag $tag does not resolve to a Git commit." >&2
              return 1
            fi
            printf '%s' "$object_sha"
          }

          current_sha="$(resolve_tag_commit)"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "Development tag $tag resolves to $current_sha, not the exact CI commit $SOURCE_SHA." >&2
            exit 1
          fi
          echo "Verified $tag -> $SOURCE_SHA."

          printf 'source_ref=refs/tags/%s\n' "$tag" >> "$GITHUB_OUTPUT"

  publish-development-prerelease:
    name: Publish source-only development pre-release
    needs: [create-development-tag]
    if: needs.create-development-tag.result == 'success'
    permissions:
      contents: write
    uses: m-mdy-m/pipeline/.github/workflows/source-release.yml@0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
    with:
      pipeline-ref: 0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
      source-ref: ${{ needs.create-development-tag.outputs.source_ref }}
      changelog-path: CHANGELOG.md
      changelog-missing-policy: warn
      release-notes-mode: section
      changelog-asset-mode: archive-only
      source-archive-name: "cdin-composition-root-{tag}-source.zip"
      source-submodules: fail-if-present

  publish-rolling-product-release:
    name: Publish the rolling latest product prerelease from verified main
    if: >-
      github.event.workflow_run.name == 'Product Acceptance' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      contents: write
    uses: m-mdy-m/pipeline/.github/workflows/rolling-release.yml@0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
    with:
      pipeline-ref: 0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
      repository: ${{ github.repository }}
      source-run-id: ${{ github.event.workflow_run.id }}
      source-workflow-path: .github/workflows/product-acceptance.yml
      source-branch: ${{ github.event.workflow_run.head_branch }}
      source-sha: ${{ github.event.workflow_run.head_sha }}
      artifact-pattern: "cdin-installed-product-*"
      product-prefix: cdin
      expected-target-profiles: >-
        [{"target":"linux-x86_64","profile":"tui"},
         {"target":"linux-x86_64","profile":"gui-sdl"},
         {"target":"linux-arm64","profile":"tui"},
         {"target":"linux-arm64","profile":"gui-sdl"},
         {"target":"macos-x86_64","profile":"tui"},
         {"target":"macos-x86_64","profile":"gui-sdl"},
         {"target":"macos-arm64","profile":"tui"},
         {"target":"macos-arm64","profile":"gui-sdl"},
         {"target":"windows-x86_64","profile":"tui"},
         {"target":"windows-x86_64","profile":"gui-sdl"}]

  inspect-legacy-alpha-release:
    name: Check the alpha.1 release without mutating existing releases
    if: >-
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      repair_required: ${{ steps.inspect.outputs.repair_required }}
    steps:
      - name: Inspect the legacy release record
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v0.3.0-alpha.1
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME")"
          tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
          tag_object="$(jq -r '.object.sha' <<<"$tag_ref")"
          if [[ "$tag_type" == "tag" ]]; then
            tag_commit="$(gh api "repos/$REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          else
            tag_commit="$tag_object"
          fi
          expected_commit="e4c5fb26659f9a00cf11163ae132ebe40e7e0157"
          if [[ "$tag_commit" != "$expected_commit" ]]; then
            echo "Immutable $TAG_NAME tag resolves to $tag_commit, expected $expected_commit." >&2
            exit 1
          fi

          releases="$(gh api "repos/$REPOSITORY/releases?per_page=100")"
          release="$(jq -c --arg tag "$TAG_NAME" '[.[] | select(.tag_name == $tag)][0] // empty' <<<"$releases")"

          if [[ -z "$release" ]]; then
            echo "The immutable $TAG_NAME tag has no GitHub Release; create a Release from that tag."
            echo "repair_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_url="$(jq -r '.html_url' <<<"$release")"
          draft="$(jq -r '.draft' <<<"$release")"
          has_changelog="$(jq -r '(.body // "") | contains("## [0.3.0-alpha.1] - 2026-11-10")' <<<"$release")"
          has_manifest="$(jq -r '[.assets[].name] | index("manifest.json") != null' <<<"$release")"
          has_checksums="$(jq -r '[.assets[].name] | index("SHA256SUMS") != null' <<<"$release")"
          has_source_archive="$(jq -r '[.assets[].name] | index("cdin-composition-root-v0.3.0-alpha.1-source.zip") != null' <<<"$release")"

          if [[ "$draft" == "true" ||
                "$release_url" != *"/tag/$TAG_NAME" ||
                "$has_changelog" != "true" ||
                "$has_manifest" != "true" ||
                "$has_checksums" != "true" ||
                "$has_source_archive" != "true" ]]; then
            echo "::error::Existing immutable Release $release_url is incomplete or malformed. Refusing to delete, replace or rewrite it."
            exit 1
          fi

          echo "Existing immutable Release is tag-backed and has the exact changelog, source archive, Pipeline manifest and checksums: $release_url"
          echo "repair_required=false" >> "$GITHUB_OUTPUT"

  repair-legacy-alpha-release:
    name: Create missing v0.3.0-alpha.1 Release from its immutable tag
    needs: [inspect-legacy-alpha-release]
    if: >-
      needs.inspect-legacy-alpha-release.outputs.repair_required == 'true' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    uses: m-mdy-m/pipeline/.github/workflows/source-release.yml@0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
    with:
      pipeline-ref: 0c2c89c7c64575c6b0f66c78925bdf5638abc5e9
      source-ref: refs/tags/v0.3.0-alpha.1
      changelog-path: CHANGELOG.md
      changelog-missing-policy: fail
      release-notes-mode: section
      changelog-asset-mode: archive-only
      source-archive-name: "cdin-composition-root-{tag}-source.zip"
      source-submodules: fail-if-present
