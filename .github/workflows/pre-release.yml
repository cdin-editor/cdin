name: Pre-release

# Every push that is not documentation-only gets its own semantic version and
# its own GitHub **prerelease**. Nothing here is a stable release.
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - ".editorconfig"
      - ".gitignore"
      - "docs/**"
      - "website/**"
      - ".github/workflows/deploy-website.yml"

  workflow_dispatch: {}

permissions:
  contents: write

# One version per pushed commit. A push must NOT cancel the run that is already
# building, or that commit never gets a number — runs queue instead.
concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Step 1 — Decide the version, before anything is built
  # ─────────────────────────────────────────────────────────────────────────
  # The version is read off the tag history, so this job has to run with the
  # full history and every tag; a shallow clone would restart the count.
  #   v0.2.1-alpha    → v0.2.1-beta.1     (stage promoted)
  #   v0.2.1-beta.9   → v0.2.1-beta.10    (counter incremented, numerically)
  #   v0.2.1-beta     → v0.2.1-rc.1       (stage promoted)
  #   v0.2.1-rc.2     → v0.2.1-rc.3
  #   (none)          → v<newest stable +1>-beta.1
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      version:  ${{ steps.next.outputs.version }}
      tag:      ${{ steps.next.outputs.tag }}
      base:     ${{ steps.next.outputs.base }}
      previous: ${{ steps.next.outputs.previous }}
      stable:   ${{ steps.next.outputs.stable }}

    steps:
      - name: Checkout (full history, all tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute the next pre-release version
        id: next
        run: |
          set -euo pipefail

          bump_patch() {
            local v="${1#v}" maj min pat
            IFS='.' read -r maj min pat <<< "$v"
            printf '%s.%s.%s\n' "${maj:-0}" "${min:-0}" "$(( ${pat:-0} + 1 ))"
          }

          # Highest pre-release tag (vX.Y.Z-<stage>[.N]). -v:refname is git's
          # version-aware sort: beta.10 beats beta.9, and a release sorts above
          # its own pre-releases — so "newest" means what SemVer says it means.
          PREV=$(git tag --list 'v*-*' --sort=-v:refname | head -n1 || true)

          # No tags at all? The changelog is the only other place a version is
          # written down; its newest heading plays the same role.
          if [[ -z "$PREV" && -f CHANGELOG.md ]]; then
            LOG_VER=$(sed -nE 's/^## \[(v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)\].*/\1/p' \
                          CHANGELOG.md | sort -V | tail -1 || true)
            if [[ -n "$LOG_VER" ]]; then PREV="v${LOG_VER#v}"; fi
          fi

          # Highest *stable* tag: same listing, minus anything pre-release.
          STABLE=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v -- '-' | head -n1 || true)
          STABLE="${STABLE:-v0.0.1}"

          BASE=""
          if [[ -n "$PREV" ]]; then
            BASE="${PREV%%-*}"     # v0.2.1
            REST="${PREV#*-}"      # alpha | alpha.3 | rc.2
            STAGE="${REST%%.*}"    # alpha | beta | rc
            COUNT=""
            if [[ "$REST" == *.* ]]; then COUNT="${REST##*.}"; fi

            if [[ -n "$COUNT" ]]; then
              # Same stage, next number. 10# keeps it decimal, so beta.9 is
              # followed by beta.10 and not by beta.10 from beta.10's own digits.
              NEXT="${BASE}-${STAGE}.$(( 10#$COUNT + 1 ))"
            else
              # The stage ran out: promote it, or open the next cycle. Promotion
              # keeps BASE; rc running out means BASE is the *next* stable, so
              # the cycle after it starts one patch higher.
              case "$STAGE" in
                alpha) NEXT="${BASE}-beta.1" ;;
                beta)  NEXT="${BASE}-rc.1"   ;;
                *)     NEXT="v$(bump_patch "${BASE:-${STABLE}}")-beta.1" ;;
              esac
            fi
          else
            # First pre-release ever: one patch above the newest stable.
            NEXT="v$(bump_patch "$STABLE")-beta.1"
          fi
          [[ "$NEXT" == v* ]] || NEXT="v${NEXT}"

          # A retried run must never reuse a tag: walk the counter up until the
          # tag is free.
          while git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null 2>&1; do
            B="${NEXT%%-*}"; R="${NEXT#*-}"; C="${R##*.}"
            if [[ "$R" == *.* ]]; then
              NEXT="${B}-${R%.*}.$(( 10#$C + 1 ))"
            else
              NEXT="${B}-${R}.2"
            fi
          done

          {
            echo "version=${NEXT#v}"
            echo "tag=${NEXT}"
            echo "base=${BASE:-${NEXT%%-*}}"
            echo "previous=${PREV}"
            echo "stable=${STABLE}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "previous pre-release : ${PREV:-<none>}"
            echo "newest stable tag    : ${STABLE}"
            echo "next version         : ${NEXT#v}"
            echo "next tag             : ${NEXT}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # Step 2 — Build (delegated to the same reusable workflows the stable
  # release uses, so a pre-release package is byte-for-byte the same build)
  # Windows and Linux only: no macOS, no Docker.
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build – Linux x86_64
    needs: version
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}

  build-windows:
    name: Build – Windows x86_64
    needs: version
    uses: ./.github/workflows/release-windows.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}

  # ─────────────────────────────────────────────────────────────────────────
  # Step 3 — Tag the commit and publish it as a prerelease
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish pre-release
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-linux.outputs.artifact-name }}
          path: dist/linux

      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: dist/windows

      - name: Collect the assets
        run: |
          set -euo pipefail
          mkdir -p dist/release
          find dist/linux dist/windows -maxdepth 1 -type f -exec cp {} dist/release/ \;
          ls -lh dist/release/

      - name: Write the release notes
        env:
          TAG:       ${{ needs.version.outputs.tag }}
          VERSION:   ${{ needs.version.outputs.version }}
          PREVIOUS:  ${{ needs.version.outputs.previous }}
          SHA:       ${{ github.sha }}
          BRANCH:    ${{ github.ref_name }}
          ACTOR:     ${{ github.actor }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL:  ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p notes

          SHORT_SHA="${SHA:0:7}"
          BUILT_AT="$(date -u '+%Y-%m-%d %H:%M UTC')"

          cat > notes/head.md << 'HEAD'
          ## ⚠️ Pre-release — this is not a stable cdin

          > **این یک نسخه پیش‌انتشار است، نه نسخه اصلی و نه نسخه پایدار.**
          > *A rolling pre-release built from `@BRANCH@`. It is published as a GitHub*
          > ***prerelease***, *it can break at any moment, and none of it is covered by*
          > *the stable-release policy. Use it to see what is landing on `main`.*

          | | |
          |---|---|
          | **Version** | `@VERSION@` |
          | **Previous pre-release** | `@PREVIOUS@` |
          | **Commit** | [`@SHORT_SHA@`](@REPO_URL@/commit/@SHA@) |
          | **Built** | @BUILT_AT@ |
          | **Triggered by** | @ACTOR@ |
          | **Workflow run** | @RUN_URL@ |

          > `python3 cdin.py update` installs the newest **stable** release and never
          > this one: GitHub keeps prereleases out of `/releases/latest`, and this
          > workflow never publishes one as stable.

          HEAD

          # What is in the build: the unreleased changelog, then every commit
          # since the previous pre-release tag.
          if [[ -n "$PREVIOUS" ]] \
             && git rev-parse -q --verify "refs/tags/$PREVIOUS" >/dev/null 2>&1; then
            RANGE="$PREVIOUS..$SHA"
            HEADING="### 🔀 Commits since \`$PREVIOUS\`"
          else
            RANGE="-n 40 $SHA"          # no previous tag: the last 40 commits
            HEADING="### 🔀 Recent commits"
          fi

          {
            if [[ -f CHANGELOG.md ]] \
               && grep -q '^## \[Unreleased\]' CHANGELOG.md; then
              echo "### 📋 Unreleased, from the changelog"
              echo
              awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md
              echo
            fi

            echo "$HEADING"
            echo
            # RANGE is deliberately unquoted: it carries two words.
            LOG=$(git log --no-merges --pretty='- `%h` %s (%an)' $RANGE | head -n 40 || true)
            if [[ -n "$LOG" ]]; then
              printf '%s\n' "$LOG"
            else
              echo "*No commit is new since the previous pre-release — same tree, republished.*"
            fi
            echo
          } > notes/changes.md

          # One table per platform, straight from the artifacts.
          rows() {
            find "$1" -maxdepth 1 -type f 2>/dev/null | sort | while IFS= read -r f; do
              name="$(basename "$f")"
              printf '| `%s` | %s | [⬇️ download](%s/releases/download/%s/%s) |\n' \
                "$name" "$(du -h "$f" | cut -f1)" "$REPO_URL" "$TAG" "$name"
            done
          }

          {
            echo "### 🐧 Linux (x86-64)"
            echo
            echo "| File | Size | Download |"
            echo "|------|------|----------|"
            rows dist/linux
            echo
            echo "### 🪟 Windows (x86-64)"
            echo
            echo "| File | Size | Download |"
            echo "|------|------|----------|"
            rows dist/windows
          } > notes/assets.md

          cat > notes/tail.md << 'TAIL'
          ---

          ## Installing this pre-release

          > **Requires Python 3.8+** — pre-installed on every supported platform.

          ### 🐧 Linux (x86-64)

          ```bash
          # .deb (Debian / Ubuntu). SDL3 ships inside the package.
          sudo apt install ./cdin_*_amd64.deb

          # tarball, any distro
          tar xzf cdin-@VERSION@-linux-x86_64.tar.gz
          cd cdin-@VERSION@-linux-x86_64

          python3 cdin.py                             # run it
          python3 cdin.py install --prefix ~/.local    # or install it
          ```

          ### 🪟 Windows (x86-64)

          ```powershell
          # installer
          .\cdin-@VERSION@-windows-setup.exe

          # or portable, no install
          Expand-Archive .\cdin-@VERSION@-windows-x86_64.zip
          cd cdin-@VERSION@-windows-x86_64
          python cdin.py
          ```

          No macOS build here: a pre-release publishes Windows and Linux only, and
          never touches Docker.

          ---

          > برای نسخه پایدار و اصلی منتظر تگ `vX.Y.Z` باشید.
          > *For the stable, official build, wait for a `vX.Y.Z` tag release.*

          TAIL

          body="$(cat notes/head.md notes/changes.md notes/assets.md notes/tail.md)"
          body="${body//@VERSION@/$VERSION}"
          body="${body//@PREVIOUS@/${PREVIOUS:-none}}"
          body="${body//@SHORT_SHA@/$SHORT_SHA}"
          body="${body//@SHA@/$SHA}"
          body="${body//@BUILT_AT@/$BUILT_AT}"
          body="${body//@ACTOR@/$ACTOR}"
          body="${body//@RUN_URL@/$RUN_URL}"
          body="${body//@REPO_URL@/$REPO_URL}"
          body="${body//@BRANCH@/$BRANCH}"
          printf '%s\n' "$body" > release_body.md

          echo "--- release body ---"
          cat release_body.md

      # The tag is pushed explicitly rather than left to the release action, so
      # the version this run decided is on the commit even if publishing the
      # release itself fails — and the next run's counter reads it.
      - name: Tag the commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n1 "$TAG")" == "$SHA" ]]; then
              echo "$TAG already points at ${SHA:0:7} — reusing it"
              exit 0
            fi
            echo "::warning::$TAG exists on another commit — moving it to ${SHA:0:7}"
            git tag -f "$TAG" "$SHA"
            git push -f origin "refs/tags/$TAG"
          else
            git -c tag.gpgSign=false tag -a "$TAG" "$SHA" \
              -m "cdin $TAG (pre-release)"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create the prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name:             "cdin ${{ needs.version.outputs.tag }} (pre-release)"
          body_path:        release_body.md
          files:            dist/release/*
          draft:            false
          prerelease:       true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
