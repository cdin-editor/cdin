name: Versioned GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the exact tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish the tag-backed GitHub Release
    needs: [verify]
    if: needs.verify.result == 'success'
    permissions:
      contents: write
    uses: m-mdy-m/pipeline/.github/workflows/source-release.yml@65ec5eb0eddc2d569ab5e8df67b93504e3bb538f
    with:
      pipeline-ref: 65ec5eb0eddc2d569ab5e8df67b93504e3bb538f
      source-ref: ${{ github.ref }}
      changelog-path: CHANGELOG.md
      changelog-missing-policy: fail
      release-notes-mode: section
      changelog-asset-mode: archive-only
      source-archive-name: "cdin-composition-root-{tag}-source.zip"
      source-submodules: fail-if-present
