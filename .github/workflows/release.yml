name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      # A pre-release tag (v0.2.1-beta.1) is NOT a stable release: it is built
      # and published by pre-release.yml, for Windows and Linux only, with no
      # Docker. Excluding it here is what keeps this workflow — and therefore
      # the Docker Hub tags — on stable versions alone.
      - '!v*-*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Delegate builds to the per-platform workflows (no duplication)
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build – Linux x86_64
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: read

  build-windows:
    name: Build – Windows x86_64
    uses: ./.github/workflows/release-windows.yml
    permissions:
      contents: read

  build-macos:
    name: Build – macOS DMG (arm64)
    uses: ./.github/workflows/release-macos.yml
    permissions:
      contents: read

  # ─────────────────────────────────────────────────────────────────────────
  # Collect all three packages → publish GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  create-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    # Do not publish a partial release if a platform build or package smoke test
    # failed. The implicit always() in the old condition allowed that to happen.
    if: success() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*setup*.exe' \) \
            -exec cp {} release/ \;
          echo "Release assets:"
          ls -lh release/
          if ! find release -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "::error::No release assets were downloaded"
            exit 1
          fi

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Determine contributors
        id: contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git tag --sort=v:refname | grep -B1 "^${CURRENT_TAG}$" | head -1 || true)

          if [[ -z "$PREV_TAG" || "$PREV_TAG" == "$CURRENT_TAG" ]]; then
            HEADER="## Contributors"
            CONTRIB=$(gh api "repos/${REPO}/contributors?per_page=100" \
              --jq '.[].login' \
              | grep -v 'github-actions\[bot\]' \
              | sed 's/^/- @/' || true)
          else
            HEADER="## Contributors (${PREV_TAG} → ${CURRENT_TAG})"
            CONTRIB=$(git log "${PREV_TAG}..${CURRENT_TAG}" --format='%H' \
              | while read -r sha; do
                  gh api "repos/${REPO}/commits/${sha}" \
                    --jq '.author.login // empty' 2>/dev/null || true
                done \
              | grep -v '^$' | grep -v 'github-actions\[bot\]' \
              | sort -u | sed 's/^/- @/' || true)
          fi
          { echo "header=${HEADER}"; echo "list<<EOF"; echo "${CONTRIB}"; echo "EOF"; } \
            >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="CHANGELOG.md"

          if [[ -f "$CHANGELOG" ]] && grep -q "## \[${VERSION}\]" "$CHANGELOG"; then
            sed -n "/## \[${VERSION}\]/,/^## \[/p" "$CHANGELOG" | sed '$d' > release_body.md
          else
            printf '## Release %s\n\nSee [CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "${{ github.ref_name }}" "${{ github.repository }}" > release_body.md
          fi

          cat >> release_body.md << 'NOTES'

          ---

          ## Installation

          > **Requires Python 3.8+** — comes pre-installed on all supported platforms.

          ### Linux (x86_64)

          **.deb (Debian/Ubuntu) — native package:**

          ```bash
          sudo apt install ./cdin_VERSION_amd64.deb
          ```

          SDL3 is bundled inside the package, so no extra runtime install is needed.
          Uninstall with `sudo apt remove cdin`.

          **Tarball (any distro):**

          ```bash
          tar xzf cdin-vVERSION-linux-x86_64.tar.gz
          cd cdin-vVERSION-linux-x86_64

          # Interactive (recommended for first-time install):
          python3 cdin.py

          # Or non-interactive:
          python3 cdin.py install                        # → ~/.local  (no sudo)
          python3 cdin.py install --prefix /usr/local    # system-wide (needs sudo)
          python3 cdin.py install --shortcut             # also create .desktop entry
          ```

          > **SDL3 runtime** — needed at runtime if not already installed:
          > - Ubuntu 24.04+: `sudo apt install libsdl3-0`
          > - Other distros: see [SDL3 releases](https://github.com/libsdl-org/SDL/releases)

          ### Windows (x86_64)

          **Installer — native, recommended:**

          1. Download `cdin-VERSION-windows-setup.exe` and run it.
          2. Follow the wizard (Next › Next › Install). Optionally adds a desktop
             shortcut and adds `cdin` to your PATH.
          3. Uninstall anytime from *Settings › Apps* or the Start Menu shortcut.

          **Zip (portable, no install):**

          1. Download `cdin-vVERSION-windows-x86_64.zip` and extract it.
          2. Open **PowerShell** or **Command Prompt** inside the extracted folder and run:

          ```powershell
          # Interactive (recommended):
          python cdin.py

          # Or non-interactive:
          python cdin.py install
          python cdin.py install --shortcut              # also create desktop shortcut
          python cdin.py install --register-filetypes    # set as default for text/code files
          python cdin.py install --prefix C:\Tools\cdin  # custom install location
          ```

          > `cdin.exe`, `SDL3.dll`, and the Lua DLL are added to `%LOCALAPPDATA%\cdin\bin`
          > and that folder is added to your **user PATH** automatically.

          ### macOS (arm64)

          1. Download **`cdin-vVERSION-macos.dmg`** and double-click it.
          2. Drag **cdin** into the **Applications** folder shortcut.
          3. Eject the disk image and open cdin from Launchpad or Spotlight.

          > SDL3 is **bundled inside** the `.app` — no Homebrew or extra installs needed.

          ---

          ## Updating & Uninstalling

          ```bash
          python3 cdin.py update              # update to latest release
          python3 cdin.py update --check      # just check, don't install
          python3 cdin.py update --version 0.2.0

          python3 cdin.py uninstall           # remove installed files
          ```

          ---
          NOTES

          sed -i "s/VERSION/${VERSION}/g" release_body.md

          cat >> release_body.md << NOTES

          ${{ steps.contributors.outputs.header }}

          ${{ steps.contributors.outputs.list }}
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       "cdin ${{ github.ref_name }}"
          body_path:  release_body.md
          files:      release/*
          draft:      false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker:
    name: Build Docker (${{ matrix.platform }})
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # native arm64 — no QEMU
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: the version comes from `git describe` inside make
          fetch-depth: 0

      - name: Checkout cdin-x (mandatory bundle source)
        uses: actions/checkout@v4
        with:
          repository: m-mdy-m/cdin-x
          path: cdin-x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Prepare platform tag
        id: platform
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=bitsgenix/cdin,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Merge the per-platform digests into one multi-arch manifest and apply
  # the real tags (semver, latest, etc.)
  # ─────────────────────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Docker Manifest
    needs: build-docker
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bitsgenix/cdin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'bitsgenix/cdin@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect published image
        run: docker buildx imagetools inspect bitsgenix/cdin:${{ steps.meta.outputs.version }}
