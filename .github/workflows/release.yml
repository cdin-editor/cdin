name: Versioned Product Release Readiness Gate

on:
  push:
    tags:
      - "v*"
      - "!v0.0.0-dev.*"

permissions:
  contents: read

jobs:
  verify-tag-on-main:
    name: Require the version tag to point into main history
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact tag and fetch main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify the tagged commit is reachable from main
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          tag_commit="$(git rev-parse "${TAG_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "Version tag $TAG_REF resolves to $tag_commit, which is not contained in main." >&2
            exit 1
          fi
          echo "Verified version tag commit $tag_commit is reachable from main."

  product-release-readiness:
    name: Refuse source-only SemVer publication until product artifacts are verified
    needs: [verify-tag-on-main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain the missing artifact-first Product Acceptance gate
        shell: bash
        run: |
          echo "::error title=Product release blocked::SemVer publication is disabled until artifact-first Product Acceptance produces verified target/profile application archives and a resolved Manifest."
          echo "source-release.yml is reserved for clearly labelled source-only contributor releases."
          echo "Do not publish a source snapshot as a versioned CDIN product release."
          exit 1
