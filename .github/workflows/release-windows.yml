name: Release – Windows

on:
  push:
    tags:
      - 'v*.*.*'
      # Pre-release tags (v0.2.1-beta.1) belong to pre-release.yml.
      - '!v*-*'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: "Version to bake into the package names (empty = derive it from the ref)"
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build-windows.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}-${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: "3.2.14"
  MSYSTEM: UCRT64
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build-windows:
    name: Build (Windows x86_64 / MinGW UCRT64)
    runs-on: windows-latest
    outputs:
      artifact-name: cdin-windows-x86_64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cdin-x supplies the mandatory vim plugin, default theme and fonts.
      # It is bundled into build/.../data by assemble_data.py / bundle.py.
      - name: Checkout cdin-x (mandatory bundle source)
        uses: actions/checkout@v4
        with:
          repository: m-mdy-m/cdin-x
          path: cdin-x

      # This step runs before MSYS2 is initialized, so use the runner's Bash.
      - name: Point the build at cdin-x
        shell: bash
        run: echo "CDINX_DIR=${GITHUB_WORKSPACE//\\//}/cdin-x" >> "$GITHUB_ENV"

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-libuv
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            make
            unzip
            zip
            curl
            git
            file
            ca-certificates

      - name: Verify UCRT64 toolchain
        run: |
          echo "MSYSTEM=${MSYSTEM}"
          test "${MSYSTEM}" = "UCRT64"
          command -v gcc
          command -v pkg-config
          command -v cmake
          command -v ninja
          gcc --version | head -1
          pkg-config --version
          if [[ "$(command -v gcc)" != /ucrt64/bin/* ]]; then
            echo "::error::Expected UCRT64 gcc from /ucrt64/bin, got: $(command -v gcc)"
            exit 1
          fi

      # Build the pinned SDL version with the same UCRT64 toolchain as cdin.
      # This avoids mixing an SDL binary built against the deprecated MINGW64
      # (MSVCRT) environment with the UCRT64 application.
      - name: Cache SDL3 (UCRT64)
        uses: actions/cache@v4
        id: cache-sdl3
        with:
          path: .github-cache/sdl3-ucrt/install
          key: sdl3-ucrt-${{ env.SDL_VERSION }}-windows-x86_64

      - name: Build and install SDL3 (UCRT64)
        run: |
          SDL_PREFIX="${PWD}/.github-cache/sdl3-ucrt/install"
          SDL_SOURCE="/tmp/sdl3-ucrt/source"
          SDL_BUILD="/tmp/sdl3-ucrt/build"

          if [[ ! -f "${SDL_PREFIX}/bin/SDL3.dll" || \
                ! -f "${SDL_PREFIX}/lib/libSDL3.dll.a" || \
                ! -f "${SDL_PREFIX}/include/SDL3/SDL.h" ]]; then
            mkdir -p "$(dirname "${SDL_PREFIX}")" /tmp/sdl3-ucrt
            curl -fsSL \
              "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz" \
              -o "/tmp/SDL3-${SDL_VERSION}.tar.gz"

            rm -rf "${SDL_SOURCE}" "${SDL_BUILD}"
            mkdir -p "${SDL_SOURCE}"
            tar -xzf "/tmp/SDL3-${SDL_VERSION}.tar.gz" \
              --strip-components=1 -C "${SDL_SOURCE}"

            cmake -S "${SDL_SOURCE}" -B "${SDL_BUILD}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${SDL_PREFIX}" \
              -DSDL_SHARED=ON \
              -DSDL_STATIC=OFF \
              -DSDL_TEST=OFF \
              -DSDL_TESTS=OFF \
              -DSDL_EXAMPLES=OFF

            cmake --build "${SDL_BUILD}" --parallel "$(nproc)"
            cmake --install "${SDL_BUILD}"
          else
            echo "SDL3 ${SDL_VERSION} restored from UCRT64 cache"
          fi

          # Install the cached/source-built SDL into this job's UCRT64 prefix.
          cp -a "${SDL_PREFIX}/include/." /ucrt64/include/
          cp -a "${SDL_PREFIX}/lib/."     /ucrt64/lib/
          cp -a "${SDL_PREFIX}/bin/."     /ucrt64/bin/

          mkdir -p /ucrt64/lib/pkgconfig
          cat > /ucrt64/lib/pkgconfig/sdl3.pc << 'PC'
          prefix=/ucrt64
          exec_prefix=${prefix}
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: SDL3
          Description: Simple DirectMedia Layer
          Version: SDL_VER_PLACEHOLDER
          Libs: -L${libdir} -lSDL3
          Cflags: -I${includedir}
          PC
          sed -i "s/SDL_VER_PLACEHOLDER/${SDL_VERSION}/" /ucrt64/lib/pkgconfig/sdl3.pc

          PKG_CONFIG_PATH=/ucrt64/lib/pkgconfig pkg-config --modversion sdl3
          test -f /ucrt64/bin/SDL3.dll
          test -f /ucrt64/lib/libSDL3.dll.a

      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg \
              -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
                        scripts/icon.svg \
            --out-inl        src/icon.inl \
            --out-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons"

      - name: Build cdin.ico
        run: |
          python3 - << 'PYEOF'
          import io
          import os
          import struct
          from PIL import Image

          sizes = [256, 64, 48, 32, 16]
          ico_dir = "scripts/icons"
          out_path = "scripts/cdin.ico"

          images = []
          for size in sizes:
              png_path = os.path.join(ico_dir, f"cdin-{size}.png")
              with open(png_path, "rb") as f:
                  img = Image.open(f)
                  img.load()
                  images.append((size, img.convert("RGBA")))

          count = len(images)
          header = struct.pack("<HHH", 0, 1, count)
          directories = b""
          data = b""
          offset = 6 + 16 * count

          for size, img in images:
              buffer = io.BytesIO()
              img.save(buffer, "PNG")
              png = buffer.getvalue()
              dimension = size if size < 256 else 0
              directories += struct.pack(
                  "<BBBBHHII", dimension, dimension, 0, 0, 1, 32, len(png), offset
              )
              data += png
              offset += len(png)

          with open(out_path, "wb") as f:
              f.write(header + directories + data)

          print(f"cdin.ico written ({os.path.getsize(out_path):,} bytes)")
          PYEOF

      - name: Build release binary
        env:
          PKG_CONFIG_PATH: /ucrt64/lib/pkgconfig
        run: |
          mingw32-make -j"$(nproc)" \
            BUILD=release \
            PLATFORM=windows \
            SDL_VERSION=3 \
            CC=gcc

      - name: Verify binary
        run: |
          EXE="$(find build/windows-release -maxdepth 1 -name 'cdin.exe' -print -quit)"
          if [[ -z "${EXE}" ]]; then
            echo "::error::cdin.exe not found under build/windows-release/"
            find build/ -type f 2>/dev/null || echo "(build/ empty)"
            exit 1
          fi
          file "${EXE}"
          echo "EXE_PATH=${EXE}" >> "$GITHUB_ENV"

      # Copy required runtime DLLs beside cdin.exe so the packaged application
      # does not require the user to install MSYS2.
      - name: Collect runtime DLLs
        run: |
          OUT_DIR="$(dirname "${EXE_PATH}")"

          SDL_DLL="$(find /ucrt64/bin -maxdepth 1 -name 'SDL3.dll' -print -quit)"
          LUA_DLL="$(find /ucrt64/bin -maxdepth 1 -name 'lua*.dll' -print | sort | head -1)"
          UV_DLL="$(find /ucrt64/bin -maxdepth 1 -name 'libuv-1.dll' -print -quit)"

          for entry in "SDL3:${SDL_DLL}" "Lua:${LUA_DLL}" "libuv:${UV_DLL}"; do
            label="${entry%%:*}"
            path="${entry#*:}"
            if [[ -z "${path}" ]]; then
              echo "::error::Required ${label} runtime DLL was not found under /ucrt64/bin"
              find /ucrt64/bin -maxdepth 1 -iname '*lua*.dll' -o -iname '*uv*.dll' -o -iname 'SDL3.dll' || true
              exit 1
            fi
            cp "${path}" "${OUT_DIR}/"
            echo "${label} runtime DLL copied: $(basename "${path}")"
          done

          # Include GCC runtime DLLs used by dynamically linked MinGW binaries.
          for dll in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            if [[ -f "/ucrt64/bin/${dll}" ]]; then
              cp -n "/ucrt64/bin/${dll}" "${OUT_DIR}/" || true
            fi
          done

          echo "Runtime DLL inventory:"
          find "${OUT_DIR}" -maxdepth 1 -type f -iname '*.dll' -printf '%f\n' | sort

      # pre-release.yml passes the version for its commit; stable tags take it
      # from the tag; manual runs use a local development version.
      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            VER="${REQUESTED_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}"

      - name: Package zip
        run: |
          VER="${{ steps.version.outputs.version }}"
          PKG_NAME="cdin-${VER}-windows-x86_64"
          PKG_DIR="dist/${PKG_NAME}"

          mkdir -p "${PKG_DIR}"
          cp "${EXE_PATH}" "${PKG_DIR}/cdin.exe"
          cp "$(dirname "${EXE_PATH}")"/*.dll "${PKG_DIR}/" 2>/dev/null || true

          # Ship the assembled build output, not the source data/ directory.
          BUILD_DIR="$(dirname "${EXE_PATH}")"
          if [[ ! -d "${BUILD_DIR}/data" ]]; then
            echo "::error::Assembled runtime data directory missing: ${BUILD_DIR}/data"
            exit 1
          fi
          mkdir -p "${PKG_DIR}/data"
          cp -RL "${BUILD_DIR}/data/." "${PKG_DIR}/data/"
          if [[ ! -f "${PKG_DIR}/data/core/init.lua" ]]; then
            echo "::error::Packaged Lua core is missing: data/core/init.lua"
            find "${PKG_DIR}/data" -maxdepth 3 -print
            exit 1
          fi
          if find "${PKG_DIR}/data" -type l -print -quit | grep -q .; then
            echo "::error::Unexpected symlink in packaged data/"
            find "${PKG_DIR}/data" -type l -ls
            exit 1
          fi

          [[ -f scripts/cdin.ico ]] && cp scripts/cdin.ico "${PKG_DIR}/"
          cp scripts/cdin.py "${PKG_DIR}/"
          cp -r scripts/_cdin "${PKG_DIR}/"

          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${PKG_DIR}/"
          done

          cd dist
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}/" > /dev/null
          echo "Zip: $(du -sh "${PKG_NAME}.zip" | cut -f1)"

      - name: Write Inno Setup script
        env:
          ISS_TEMPLATE: |
            #define MyAppName "cdin"
            #define MyAppVersion "__ISS_VER__"
            #define MyAppPublisher "m-mdy-m"
            #define MyAppURL "https://github.com/m-mdy-m/cdin"
            #define MyAppExeName "cdin.exe"

            [Setup]
            AppId={{B6E1B1F0-7C2E-4C7B-9C1D-CDIN00000001}
            AppName={#MyAppName}
            AppVersion={#MyAppVersion}
            AppPublisher={#MyAppPublisher}
            AppPublisherURL={#MyAppURL}
            AppSupportURL={#MyAppURL}
            AppUpdatesURL={#MyAppURL}
            DefaultDirName={autopf}\__MyAppName__
            DefaultGroupName={#MyAppName}
            DisableProgramGroupPage=yes
            PrivilegesRequiredOverridesAllowed=dialog
            OutputDir=__OUT_DIR__
            OutputBaseFilename=cdin-__ISS_VER__-windows-setup
            SetupIconFile=__SRC_DIR__\cdin.ico
            Compression=lzma2
            SolidCompression=yes
            WizardStyle=modern
            LicenseFile=__SRC_DIR__\LICENSE
            ArchitecturesAllowed=x64compatible
            ArchitecturesInstallIn64BitMode=x64compatible
            UninstallDisplayIcon={app}\{#MyAppExeName}

            [Languages]
            Name: "english"; MessagesFile: "compiler:Default.isl"

            [Tasks]
            Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional shortcuts:"
            Name: "addtopath"; Description: "Add cdin to PATH"; GroupDescription: "Additional shortcuts:"

            [Files]
            Source: "__SRC_DIR__\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

            [Icons]
            Name: "{group}\cdin"; Filename: "{app}\{#MyAppExeName}"
            Name: "{group}\Uninstall cdin"; Filename: "{uninstallexe}"
            Name: "{autodesktop}\cdin"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

            [Registry]
            Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; \
              ValueData: "{olddata};{app}"; Tasks: addtopath; Check: NeedsAddPath('{app}')

            [Run]
            Filename: "{app}\{#MyAppExeName}"; Description: "Launch cdin"; Flags: nowait postinstall skipifsilent

            [Code]
            function NeedsAddPath(Param: string): boolean;
            var
              OrigPath: string;
            begin
              if not RegQueryStringValue(HKEY_CURRENT_USER, 'Environment', 'Path', OrigPath) then
              begin
                Result := True;
                exit;
              end;
              Result := Pos(';' + Param + ';', ';' + OrigPath + ';') = 0;
            end;
        run: |
          VER="${{ steps.version.outputs.version }}"
          ISS_VER="${VER#v}"
          PKG_NAME="cdin-${VER}-windows-x86_64"
          SRC_DIR="$(cygpath -w "${PWD}/dist/${PKG_NAME}")"
          OUT_DIR="$(cygpath -w "${PWD}/dist")"

          # Bash parameter expansion preserves backslashes in Windows paths.
          content="$ISS_TEMPLATE"
          content="${content//__ISS_VER__/$ISS_VER}"
          content="${content//__OUT_DIR__/$OUT_DIR}"
          content="${content//__SRC_DIR__/$SRC_DIR}"
          content="${content//__MyAppName__/\{#MyAppName\}}"

          printf '%s\n' "$content" > dist/cdin-installer.iss
          echo "Wrote dist/cdin-installer.iss"
          cat dist/cdin-installer.iss

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", "${env:ProgramFiles}" `
            -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          Write-Host "Using compiler: $iscc"
          & $iscc "dist\cdin-installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe exited with code $LASTEXITCODE"
          }
          Get-ChildItem dist\*setup*.exe | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdin-windows-x86_64
          path: |
            dist/*.zip
            dist/*setup*.exe
          if-no-files-found: error
          retention-days: 14
