name: Release – Windows

on:
  push:
    tags:
      - 'v*.*.*'
      # Pre-release tags (v0.2.1-beta.1) belong to pre-release.yml: they are
      # published as GitHub prereleases, never through the stable path.
      - '!v*-*'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: "Version to bake into the package names (empty = derive it from the ref)"
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build-windows.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}-${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: "3.2.14"
  MSYSTEM: MINGW64
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build-windows:
    name: Build (Windows x86_64 / MinGW)
    runs-on: windows-latest
    outputs:
      artifact-name: cdin-windows-x86_64
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cdin-x is where the mandatory set lives: the vim plugin, the default
      # theme and the fonts. A cdin build bundles it into build/…/data via
      # scripts/assemble_data.py -> scripts/bundle.py. actions/checkout refuses
      # any `path` outside GITHUB_WORKSPACE, so it cannot be checked out as a
      # sibling (`../cdin-x`); it goes inside the workspace and CDINX_DIR points
      # the build at it. The build itself never fetches anything.
      - name: Checkout cdin-x (mandatory bundle source)
        uses: actions/checkout@v4
        with:
          repository: m-mdy-m/cdin-x
          path: cdin-x

      # mk/bundle.mk uses `CDINX_DIR ?=`, so the environment value is picked up
      # by every later `make` step without changing the make command lines.
      - name: Point the build at cdin-x
        shell: bash
        run: echo "CDINX_DIR=${GITHUB_WORKSPACE//\\//}/cdin-x" >> "$GITHUB_ENV"

      # msys2/setup-msys2 has built-in cache support via cache: true
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-libuv
            make
            unzip
            zip
            curl

      # ── Cache: SDL3 zip download + extracted headers/libs ────────────────
      - name: Cache SDL3 (MinGW)
        uses: actions/cache@v4
        id: cache-sdl3
        with:
          path: /tmp/sdl3
          key: sdl3-mingw-${{ env.SDL_VERSION }}

      - name: Install SDL3 (MinGW pre-built)
        run: |
          if [[ ! -d "/tmp/sdl3/SDL3-${SDL_VERSION}" ]]; then
            SDL_ZIP="SDL3-devel-${SDL_VERSION}-mingw.zip"
            SDL_URL="https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/${SDL_ZIP}"
            curl -fsSL -o "${SDL_ZIP}" "${SDL_URL}"
            unzip -q "${SDL_ZIP}" -d /tmp/sdl3
          else
            echo "SDL3 ${SDL_VERSION} restored from cache"
          fi

          SDL_ROOT="/tmp/sdl3/SDL3-${SDL_VERSION}/x86_64-w64-mingw32"
          cp -r "${SDL_ROOT}/include/"* /mingw64/include/
          cp -r "${SDL_ROOT}/lib/"*     /mingw64/lib/
          cp -r "${SDL_ROOT}/bin/"*     /mingw64/bin/

          mkdir -p /mingw64/lib/pkgconfig
          cat > /mingw64/lib/pkgconfig/sdl3.pc << 'PC'
          prefix=/mingw64
          exec_prefix=${prefix}
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: SDL3
          Description: Simple DirectMedia Layer
          Version: SDL_VER_PLACEHOLDER
          Libs: -L${libdir} -lSDL3
          Cflags: -I${includedir}
          PC
          sed -i "s/SDL_VER_PLACEHOLDER/${SDL_VERSION}/" /mingw64/lib/pkgconfig/sdl3.pc
          pkg-config --modversion sdl3 && echo "SDL3 pkg-config OK"

      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg \
              -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
                        scripts/icon.svg \
            --out-inl        src/icon.inl \
            --out-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons"

      - name: Build cdin.ico
        run: |
          python3 - << 'PYEOF'
          import struct, io, os
          from PIL import Image

          sizes    = [256, 64, 48, 32, 16]
          ico_dir  = "scripts/icons"
          out_path = "scripts/cdin.ico"

          imgs = []
          for sz in sizes:
              png_path = os.path.join(ico_dir, f"cdin-{sz}.png")
              with open(png_path, "rb") as f:
                  img = Image.open(f)
                  img.load()
                  imgs.append((sz, img.convert("RGBA")))

          n      = len(imgs)
          header = struct.pack("<HHH", 0, 1, n)
          dirs   = b""
          data   = b""
          offset = 6 + 16 * n

          for sz, img in imgs:
              buf = io.BytesIO()
              img.save(buf, "PNG")
              png = buf.getvalue()
              bw  = sz if sz < 256 else 0
              dirs += struct.pack("<BBBBHHII", bw, bw, 0, 0, 1, 32, len(png), offset)
              data += png
              offset += len(png)

          with open(out_path, "wb") as f:
              f.write(header + dirs + data)

          print(f"cdin.ico written ({os.path.getsize(out_path):,} bytes)")
          PYEOF

      - name: Build release binary
        run: |
          mingw32-make -j$(nproc) \
            BUILD=release \
            PLATFORM=windows \
            SDL_VERSION=3 \
            CC=x86_64-w64-mingw32-gcc

      - name: Verify binary
        run: |
          EXE="$(find build/windows-release -maxdepth 1 -name 'cdin.exe' | head -1)"
          if [[ -z "$EXE" ]]; then
            echo "::error::cdin.exe not found under build/windows-release/"
            find build/ -type f 2>/dev/null || echo "(build/ empty)"
            exit 1
          fi
          file "$EXE"
          echo "EXE_PATH=$EXE" >> "$GITHUB_ENV"

      # Copy runtime DLLs beside cdin.exe so the packaged application can run
      # without requiring the user to install MSYS2.
      - name: Collect runtime DLLs
        run: |
          OUT_DIR="$(dirname "$EXE_PATH")"

          SDL_DLL="$(find /mingw64/bin -name 'SDL3.dll' -print -quit)"
          LUA_DLL="$(find /mingw64/bin -name 'lua*.dll' -print | sort | head -1)"
          UV_DLL="$(find /mingw64/bin -name 'libuv-1.dll' -print -quit)"

          if [[ -n "$SDL_DLL" ]]; then
            cp "$SDL_DLL" "$OUT_DIR/"
            echo "SDL3 runtime DLL copied: $(basename "$SDL_DLL")"
          else
            echo "::warning::SDL3.dll not found"
          fi

          if [[ -n "$LUA_DLL" ]]; then
            cp "$LUA_DLL" "$OUT_DIR/"
            echo "Lua runtime DLL copied: $(basename "$LUA_DLL")"
          else
            echo "::warning::Lua DLL not found"
          fi

          if [[ -n "$UV_DLL" ]]; then
            cp "$UV_DLL" "$OUT_DIR/"
            echo "libuv runtime DLL copied: $(basename "$UV_DLL")"
          else
            echo "::warning::libuv-1.dll not found under /mingw64/bin"
            echo "Checking whether libuv is statically linked or uses another DLL name."
            find /mingw64/bin -maxdepth 1 -iname '*uv*.dll' -print || true
          fi

      # ── Version for the package names ────────────────────────────────────
      # pre-release.yml passes the version it computed for this commit; a tag
      # push takes it from the tag; anything else is a local dev build.
      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            VER="${REQUESTED_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}"

      - name: Package zip
        run: |
          VER="${{ steps.version.outputs.version }}"
          PKG_NAME="cdin-${VER}-windows-x86_64"
          PKG_DIR="dist/${PKG_NAME}"

          mkdir -p "${PKG_DIR}"
          cp "${EXE_PATH}" "${PKG_DIR}/cdin.exe"
          cp "$(dirname "${EXE_PATH}")"/*.dll "${PKG_DIR}/" 2>/dev/null || true

          # The ASSEMBLED data/, next to the binary that was just built — not
          # the source data/. The source holds only the runtime core; the
          # mandatory set (vim plugin, default theme, fonts) is bundled from
          # cdin-x into the build output at build time, and that is what a
          # release has to ship.
          BUILD_DIR="$(dirname "$EXE_PATH")"
          [[ -d "${BUILD_DIR}/data" ]] && cp -r "${BUILD_DIR}/data" "${PKG_DIR}/"

          [[ -f scripts/cdin.ico ]] && cp scripts/cdin.ico "${PKG_DIR}/"

          cp scripts/cdin.py "${PKG_DIR}/"
          cp -r scripts/_cdin "${PKG_DIR}/"

          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${PKG_DIR}/"
          done

          cd dist
          zip -r "${PKG_NAME}.zip" "${PKG_NAME}/" > /dev/null
          echo "Zip: $(du -sh ${PKG_NAME}.zip | cut -f1)"

      - name: Write Inno Setup script
        env:
          ISS_TEMPLATE: |
            #define MyAppName "cdin"
            #define MyAppVersion "__ISS_VER__"
            #define MyAppPublisher "m-mdy-m"
            #define MyAppURL "https://github.com/m-mdy-m/cdin"
            #define MyAppExeName "cdin.exe"

            [Setup]
            AppId={{B6E1B1F0-7C2E-4C7B-9C1D-CDIN00000001}
            AppName={#MyAppName}
            AppVersion={#MyAppVersion}
            AppPublisher={#MyAppPublisher}
            AppPublisherURL={#MyAppURL}
            AppSupportURL={#MyAppURL}
            AppUpdatesURL={#MyAppURL}
            DefaultDirName={autopf}\__MyAppName__
            DefaultGroupName={#MyAppName}
            DisableProgramGroupPage=yes
            PrivilegesRequiredOverridesAllowed=dialog
            OutputDir=__OUT_DIR__
            OutputBaseFilename=cdin-__ISS_VER__-windows-setup
            SetupIconFile=__SRC_DIR__\cdin.ico
            Compression=lzma2
            SolidCompression=yes
            WizardStyle=modern
            LicenseFile=__SRC_DIR__\LICENSE
            ArchitecturesAllowed=x64compatible
            ArchitecturesInstallIn64BitMode=x64compatible
            UninstallDisplayIcon={app}\{#MyAppExeName}

            [Languages]
            Name: "english"; MessagesFile: "compiler:Default.isl"

            [Tasks]
            Name: "desktopicon"; Description: "Create a &desktop shortcut"; GroupDescription: "Additional shortcuts:"
            Name: "addtopath"; Description: "Add cdin to PATH"; GroupDescription: "Additional shortcuts:"

            [Files]
            Source: "__SRC_DIR__\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

            [Icons]
            Name: "{group}\cdin"; Filename: "{app}\{#MyAppExeName}"
            Name: "{group}\Uninstall cdin"; Filename: "{uninstallexe}"
            Name: "{autodesktop}\cdin"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

            [Registry]
            Root: HKCU; Subkey: "Environment"; ValueType: expandsz; ValueName: "Path"; \
              ValueData: "{olddata};{app}"; Tasks: addtopath; Check: NeedsAddPath('{app}')

            [Run]
            Filename: "{app}\{#MyAppExeName}"; Description: "Launch cdin"; Flags: nowait postinstall skipifsilent

            [Code]
            function NeedsAddPath(Param: string): boolean;
            var
              OrigPath: string;
            begin
              if not RegQueryStringValue(HKEY_CURRENT_USER, 'Environment', 'Path', OrigPath) then
              begin
                Result := True;
                exit;
              end;
              Result := Pos(';' + Param + ';', ';' + OrigPath + ';') = 0;
            end;
        run: |
          VER="${{ steps.version.outputs.version }}"
          ISS_VER="${VER#v}"
          PKG_NAME="cdin-${VER}-windows-x86_64"
          # Paths inside the .iss are consumed by ISCC.exe (native Windows),
          # so use Windows-style backslashes even though we're in a bash step.
          SRC_DIR=$(cygpath -w "${PWD}/dist/${PKG_NAME}")
          OUT_DIR=$(cygpath -w "${PWD}/dist")

          # ISS_TEMPLATE comes in as a YAML block scalar (env:), which keeps
          # a clean, unindented literal value — no heredoc indentation issue.
          # Placeholders are substituted with bash's ${var//search/replace}
          # rather than sed: OUT_DIR/SRC_DIR are Windows paths from cygpath
          # containing literal backslashes, which sed's replacement text
          # would reinterpret as escapes; bash parameter expansion treats the
          # replacement as a literal string, so backslashes pass through
          # untouched. The template's own {#MyAppName}-style Inno Setup
          # syntax is left alone either way since it isn't a placeholder.
          content="$ISS_TEMPLATE"
          content="${content//__ISS_VER__/$ISS_VER}"
          content="${content//__OUT_DIR__/$OUT_DIR}"
          content="${content//__SRC_DIR__/$SRC_DIR}"
          content="${content//__MyAppName__/\{#MyAppName\}}"

          printf '%s\n' "$content" > dist/cdin-installer.iss

          echo "Wrote dist/cdin-installer.iss"
          cat dist/cdin-installer.iss

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", "${env:ProgramFiles}" `
            -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup"
          }
          Write-Host "Using compiler: $iscc"
          & $iscc "dist\cdin-installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe exited with code $LASTEXITCODE"
          }
          Get-ChildItem dist\*setup*.exe | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdin-windows-x86_64
          path: |
            dist/*.zip
            dist/*setup*.exe
          if-no-files-found: error
          retention-days: 14