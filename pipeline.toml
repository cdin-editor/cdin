schema_version = 1

[project]
name = "cdin"
description = "Composition Root build, pinned stack verification and lifecycle E2E"

[defaults]
timeout_seconds = 3600
fail_fast = true

[tasks.dependencies]
description = "Materialize immutable non-component build dependencies"
command = ["python3", "scripts/deps.py"]
timeout_seconds = 1200

[tasks.registry]
description = "Build Registry, resolve CDIN releases, prepare and replay the immutable source workspace"
command = ["python3", "scripts/registry.py", "--source-build", "--developer-source-components"]
depends_on = ["dependencies"]
timeout_seconds = 2400

[tasks.stack]
description = "Build, test, install and smoke-test the selected Registry-prepared developer profile; SDL3 source is explicitly opted in"
command = ["python3", "scripts/build_stack.py", "--registry-source-build", "--build-sdl3-from-source"]
depends_on = ["registry"]
timeout_seconds = 3600

[tasks.check]
description = "Run the full pinned stack and architecture boundary checks"
command = ["python3", "scripts/check_boundaries.py"]
depends_on = ["stack"]
timeout_seconds = 120

[tasks.package]
description = "Create a source archive for review"
command = ["python3", "scripts/package.py"]
timeout_seconds = 120

[tasks.bootstrap-tests]
description = "Test portable Python and Registry Go toolchain environment selection"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_registry_bootstrap.py"]
timeout_seconds = 60

[tasks.registry-artifact-tests]
description = "Test immutable Registry release bootstrap, provenance and cache verification"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_registry_artifact.py"]
timeout_seconds = 60

[tasks.sdl3-source-tests]
description = "Test bounded SDL3 source extraction and explicit developer-only opt-in"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_build_stack_sdl3.py"]
timeout_seconds = 60

[tasks.pre-release-tests]
description = "Test the source pre-release manifest against Registry artifact/source delivery semantics"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_pre_release.py"]
timeout_seconds = 60

[tasks.release-workflow-tests]
description = "Verify legacy release repair workflows preserve immutable tags and existing Releases"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_release_workflow_safety.py"]
timeout_seconds = 60

[tasks.distribution-tests]
description = "Test installed application archive provenance, safe extraction and product launch verification"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_package_distribution.py"]
timeout_seconds = 60

[tasks.distribution]
description = "Package the installed CDIN application prefix and verify it from a clean extracted directory"
command = ["python3", "scripts/package_distribution.py"]
depends_on = ["stack"]
timeout_seconds = 240

[tasks.pre-release]
description = "Prepare verified CDIN source and installed-product development artifacts after full product checks"
command = ["python3", "scripts/pre_release.py"]
depends_on = ["check", "package", "bootstrap-tests", "registry-artifact-tests", "sdl3-source-tests", "pre-release-tests", "release-workflow-tests", "distribution-tests", "distribution"]
timeout_seconds = 300
