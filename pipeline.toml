schema_version = 1

[project]
name = "cdin"
description = "Composition Root build, pinned stack verification and lifecycle E2E"

[defaults]
timeout_seconds = 3600
fail_fast = true

[tasks.dependencies]
description = "Materialize immutable non-component build dependencies"
command = ["python3", "scripts/deps.py"]
timeout_seconds = 1200

[tasks.registry]
description = "Build Registry, resolve CDIN releases, prepare and replay the immutable source workspace"
command = ["python3", "scripts/registry.py"]
depends_on = ["dependencies"]
timeout_seconds = 2400

[tasks.stack]
description = "Build, test, install and smoke-test the selected Registry-prepared product profile"
command = ["python3", "scripts/build_stack.py", "--build-sdl3-from-source"]
depends_on = ["registry"]
timeout_seconds = 3600

[tasks.check]
description = "Run the full pinned stack and architecture boundary checks"
command = ["python3", "scripts/check_boundaries.py"]
depends_on = ["stack"]
timeout_seconds = 120

[tasks.package]
description = "Create a source archive for review"
command = ["python3", "scripts/package.py"]
timeout_seconds = 120

[tasks.bootstrap-tests]
description = "Test portable Python and Registry Go toolchain environment selection"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_registry_bootstrap.py"]
timeout_seconds = 60

[tasks.sdl3-source-tests]
description = "Test SDL3 source archive extraction and SDK package safety"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*sdl3*.py"]
timeout_seconds = 60

[tasks.pre-release]
description = "Prepare a verified CDIN source pre-release report after the full product checks and reproducible package"
command = ["python3", "scripts/pre_release.py"]
depends_on = ["check", "package", "bootstrap-tests", "sdl3-source-tests"]
timeout_seconds = 180
