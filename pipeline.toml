schema_version = 1

[project]
name = "cdin"
description = "Composition Root build, pinned stack verification and lifecycle E2E"

[defaults]
timeout_seconds = 3600
fail_fast = true

[tasks.dependencies]
description = "Resolve and materialize every immutable source pin"
command = ["python3", "scripts/deps.py"]
timeout_seconds = 1200

[tasks.stack]
description = "Build, test, install and smoke-test the full pinned component stack"
command = ["python3", "scripts/build_stack.py"]
depends_on = ["dependencies"]
timeout_seconds = 3600

[tasks.check]
description = "Run the full pinned stack and architecture boundary checks"
command = ["python3", "scripts/check_boundaries.py"]
depends_on = ["stack"]
timeout_seconds = 120

[tasks.package]
description = "Create a source archive for review"
command = ["python3", "scripts/package.py"]
timeout_seconds = 120
