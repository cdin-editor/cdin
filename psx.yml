version: 1
project:
  type: generic

rules:
  readme: error
  license: warning
  changelog: info
  tests_folder: error
  docs_folder: error
  contributing: info
  security: info
  code_of_conduct: info
  pull_request_template: info
  issue_templates: info
  editorconfig: info
  code_owners: info

custom:
  folders:
    - path: "include"
      structure:
        cdin: {}
    - path: "src"
      structure:
        cli: {}
        diagnostics: {}
    - path: "tests"
      structure:
        e2e: {}
        bench: {}
        architecture: {}
    - path: "docs"
      structure:
        architecture: {}
        development: {}
    - path: ".github/workflows"
    - path: "scripts"
  files:
    - path: "/pipeline.toml"
    - path: "/deps.lock"
    - path: "/Makefile"
