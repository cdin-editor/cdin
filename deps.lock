# Exact source pin used only by explicit contributor/CI source-build targets.
# It is the same immutable source commit as the consumer Release pin, but
# represents a separate delivery mode. Normal make install always uses the
# verified prebuilt Registry executable above.
[tooling.registry.development]
repository = "https://github.com/cdin-editor/registry.git"
revision = "b7aa6c99600eb31f89ca2c4734f326030dfe4fe4"
version = "1.0.1"

