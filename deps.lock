# Pinned SDK packages for contracts provided by the CDIN build environment.
# Kernel 1.2.1's published native packages contain both cdin-kernel and the
# independently versioned m-mdy-m/log.c 0.1.0 SDK. The package source commit,
# tag, per-target asset size and GitHub-published SHA-256 are immutable inputs.

[dependencies]

[dependencies.kernel_sdk]
repository = "https://github.com/cdin-editor/kernel"
tag = "v1.2.1"
version = "1.2.1"
revision = "f4875b6eb59bd76878e7ff486b6114abd9bb1329"
kernel_abi = "1.1.0"
logger_version = "0.1.0"

[dependencies.kernel_sdk.assets."linux-x86_64"]
file_name = "cdin-kernel-1.2.1-linux-x86_64.tar.gz"
