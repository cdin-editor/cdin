# Pinned SDK packages for contracts provided by the CDIN build environment.
# Kernel 1.2.3 publishes target-native archives containing both the Kernel C
# SDK and its separately versioned m-mdy-m/log.c 0.1.0 static SDK. These are
# the ordinary installable release archives with their verified installer;
# the parallel cmake-prefix-v1 archives are consumed through Registry.
#
# The package source commit, tag, per-target asset size and GitHub-published
# SHA-256 are immutable inputs.

[dependencies]

[dependencies.kernel_sdk]
repository = "https://github.com/cdin-editor/kernel"
tag = "v1.2.3"
version = "1.2.3"
revision = "2fb09f52dc1a9963cf358ec54d584c520e174e67"
kernel_abi = "1.1.0"
logger_version = "0.1.0"

[dependencies.kernel_sdk.assets."linux-x86_64"]
