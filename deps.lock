# Consumer Registry release pin. The descriptor digest/size are intentionally
# absent until Registry #58 publishes and verifies the corrected 0.2.0-dev.2
# release. Normal acquisition therefore fails closed rather than using v0.1.0-dev.
[tooling.registry]
repository = "https://github.com/cdin-editor/registry.git"
revision = "cdcf86ed6a8788bf20fa0bcd821bb91242ba09a4"
version = "0.1.0-dev"
release_tag = "v0.1.0-dev"

# Exact source pin used only by explicit contributor/CI source-build targets.
# This is not a consumer release pin and must never be used by normal make install.
[tooling.registry.development]
repository = "https://github.com/cdin-editor/registry.git"
revision = "9c5a2960c77985a3fb7c7a535635c3f1b6093baa"
version = "0.2.0-dev.2"

# This source archive is for explicit developer/CI fallback only.
# Normal GUI-SDL consumers use scripts/sdl3_artifact.py and require a complete
# [dependencies.sdl3_sdk] five-target immutable Release pin. That table is
# intentionally absent until CDIN #124 publishes and verifies every asset;
# do not invent tag commits, sizes or digests.
[tooling.sdl3]
version = "3.4.16"
archive = "https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz"
sha256 = "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68"
